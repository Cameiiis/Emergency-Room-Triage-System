name: Java regression test

on:
  push:
    branches: [fix/queue-display-order]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile and run queue display test
        run: |
          javac -encoding UTF-8 -d out SecondLabExam.java QueueDisplayTest.java
          java -cp out CCE105LAB.QueueDisplayTest
